name: Build Windows and Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "packaging/**"
      - "src/**"
      - "tests/**"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install Linux Qt and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libxcb-randr0 libxcb-xfixes0 libxcb-sync1 \
            desktop-file-utils squashfs-tools xvfb xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Freeze application
        env:
          PYTHONPATH: src
        run: python src/setup.py build_exe --build-exe build/frozen

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python packaging/smoke-test.py build/frozen/BSL.exe

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/bsl.desktop
          bash packaging/build-appimage.sh

      - name: Smoke test extracted AppImage using X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/BSL-linux-x86_64.AppImage" --appimage-extract > /dev/null
          xvfb-run -a python "$GITHUB_WORKSPACE/packaging/smoke-test.py" "$RUNNER_TEMP/squashfs-root/AppRun"

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BSL-windows-x64
          path: build/frozen/
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BSL-linux-x86_64
          path: dist/BSL-linux-x86_64.AppImage
          if-no-files-found: error
  release:
    name: Publish release assets
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: BSL-windows-x64
          path: artifacts/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: BSL-linux-x86_64
          path: artifacts/linux

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/windows/BSL.exe
          test -s artifacts/linux/BSL-linux-x86_64.AppImage
          mkdir -p release-assets
          (cd artifacts/windows && zip -r ../../release-assets/BSL-windows-x64.zip .)
          cp artifacts/linux/BSL-linux-x86_64.AppImage release-assets/

      - name: Create release if needed and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/BSL-windows-x64.zip \
            release-assets/BSL-linux-x86_64.AppImage --clobber
